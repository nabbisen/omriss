name: Windows build

# Non-routine: run by hand when someone needs a Windows executable to try —
# an owner check on Windows, a build to hand to a tester. Routine checks on
# Windows (tests, clippy) stay in ci.yml and run on every push; release
# packaging is release.yml's. Choose the branch in "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Build release binary
        run: cargo build --release -p omriss

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: omriss-windows-exe
          path: target/release/omriss.exe
          if-no-files-found: error
