name: Windows build

# Non-routine: run by hand when someone needs a Windows executable to try —
# an owner check on Windows, a build to hand to a tester. Routine checks on
# Windows (tests, clippy) stay in ci.yml and run on every push; release
# packaging is release.yml's. Choose the branch in "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-release

      - name: Build release binary
        run: cargo build --release -p omriss

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omriss-windows-exe
          path: target/release/omriss.exe
          if-no-files-found: error
