name: Release

# Tag-triggered, but a tag alone cannot reach the Store.
#
# A tag can point at any commit, including one never reviewed or merged. So the
# trigger only *proposes* a release; three things gate it:
#
#   1. `verify` refuses tags whose commit is not on main, and refuses tags whose
#      version does not match Cargo.toml and AppxManifest.xml.
#   2. `publish` targets the `microsoft-store` environment, which must be
#      configured with required reviewers. That approval is RFC-042 section 5's
#      "explicit confirmation from the product owner", encoded rather than
#      remembered -- a stray tag creates a pending deployment, not a submission.
#   3. The Store credentials live in that environment, not at repo level, so no
#      other workflow or branch can read them.
#
# Since RFC-072 the same tag also builds the Linux tarball (and its checksum) and
# creates the GitHub Release that carries it. The release is created only after
# `verify`, the Windows `package` job and the Linux job have all passed, on the
# `github-release` environment, and never in dry-run mode. A version is published
# everywhere CI publishes it or nowhere: the Store job and both AUR jobs wait for
# that release.
#
# The AUR jobs (`aur-source`, `aur-bin`) are off until the owner turns them on:
# they run only when the repository variable AUR_PUBLISH is "true", and then only on
# the `aur` environment, which holds the SSH key. A dry run writes to no AUR package
# at all, unless it is given two scratch package names (REHEARSAL, below).
#
# DRY RUN: a manual run (`workflow_dispatch`) with `dry_run` ticked, the default,
# builds and uploads everything and then stops. It creates no release and
# publishes nothing, to the Store or anywhere else. Only a pushed tag, or a manual
# run with `dry_run` unticked, can publish.
#
# REHEARSAL of the AUR jobs: a dry run that also names two scratch AUR packages
# (`aur_source_package`, `aur_bin_package`, neither of them omriss nor omriss-bin)
# pushes a PKGBUILD to each of those, and to nothing else. It is how the owner tries
# the key, the `aur` environment and the push before a real tag. scripts/aur-names.sh
# decides this, and is tested by scripts/test-aur-scripts.sh.
#
# Every action is pinned to a commit SHA with its tag in a comment: these jobs run
# with credentials in scope, and a moving tag could change under us.
#
# See RELEASE_CHECKLIST.md: the GUI smoke workflow cannot run here and remains
# a human step before approving the deployment.

on:
  push:
    # Release tags are bare semver, no "v" prefix, per Rust crate convention
    # (0.16.0, 0.15.6, ...). This is a GitHub filter-pattern glob, not a regex:
    # "+" means one or more of the preceding character and "." is literal.
    # Pre-release tags such as 0.17.0-rc1 deliberately do not match.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. 0.17.0); for a dry run, a branch such as main will do'
        required: true
      dry_run:
        description: 'Dry run: build and upload the artifacts, create no release, publish nothing'
        type: boolean
        default: true
      aur_source_package:
        description: 'Dry run only: a scratch AUR package to push the omriss PKGBUILD to (needs aur_bin_package too); leave both empty to write to no AUR package'
        required: false
      aur_bin_package:
        description: 'Dry run only: a scratch AUR package to push the omriss-bin PKGBUILD to (needs aur_source_package too)'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      aur_source_name: ${{ steps.aur.outputs.aur_source_name }}
      aur_bin_name: ${{ steps.aur.outputs.aur_bin_name }}
      aur_rehearsal: ${{ steps.aur.outputs.aur_rehearsal }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Tag must match Cargo.toml and AppxManifest, and be on main
        id: check
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$DRY_RUN" = "true" ]; then
            # A dry run exists to be run BEFORE the tag does: the tag that holds
            # the packaging files is the one this rehearses. So it may name a
            # branch (main), and its version is whatever Cargo.toml says.
            version="$cargo_version"
            echo "::notice::DRY RUN of '$REF' as version $version: no release, nothing published"
          else
            version="$REF"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$cargo_version" != "$version" ]; then
            echo "::error::tag $version does not match Cargo.toml version $cargo_version"
            exit 1
          fi

          # The Store rejects a resubmission of an existing version, and a
          # mismatch here is the easiest way to ship 0.17.0 code labelled
          # 0.18.0 to users.
          manifest_version=$(grep -m1 -o 'Version="[0-9.]*"' packaging/windows/AppxManifest.xml | cut -d'"' -f2)
          if [ "$manifest_version" != "$version.0" ]; then
            echo "::error::AppxManifest version $manifest_version does not match tag $version (expected $version.0)"
            exit 1
          fi

          # A release without its notes is a release nobody can read: the dated
          # CHANGELOG section must exist (and so must the metainfo <release>,
          # which the Linux job's tarball script checks).
          bash scripts/changelog-section.sh "$version" > /dev/null

          # Use the checked-out HEAD, not GITHUB_SHA: under workflow_dispatch
          # GITHUB_SHA is the dispatching ref, not the tag being released.
          tagged_commit=$(git rev-parse HEAD)
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "::error::tagged commit $tagged_commit is not an ancestor of main; refusing to publish unreviewed code"
            exit 1
          fi

      # Which AUR packages this run may write to. Decided here, once, by a script
      # with tests; the AUR jobs only read the answer.
      - name: Which AUR packages this run may write to
        id: aur
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SOURCE_NAME: ${{ github.event.inputs.aur_source_package }}
          BIN_NAME: ${{ github.event.inputs.aur_bin_package }}
        run: bash scripts/aur-names.sh >> "$GITHUB_OUTPUT"

  package:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Test before packaging
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p omriss

      # NOTE: this reproduces what has until now been a manual, undocumented
      # step on the maintainer's machine. It must be confirmed against that
      # process before the first automated publish -- see the readiness report.
      - name: Stage MSIX layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/omriss.exe staging/
          Copy-Item packaging/windows/AppxManifest.xml staging/
          Copy-Item -Recurse packaging/windows/Assets staging/Assets

      # The version reaches the script as an environment variable, never as
      # expression text (scripts/check-workflows.sh enforces this for all of CI).
      - name: Pack MSIX
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $makeappx = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK" }
          & $makeappx.FullName pack /d staging /p "omriss-${env:VERSION}.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }

      - name: Upload MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omriss-msix
          path: omriss-*.msix
          if-no-files-found: error

  # RFC-072 §5.1. Same script as the local proof of the PKGBUILDs
  # (scripts/build-linux-tarball.sh), so the artifact cannot drift from what was
  # checked. Tests first, as the Windows job does: nothing ships that failed them.
  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      # The same packages ci.yml installs; crates/app links the system WebView.
      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: Test before packaging
        run: cargo test --workspace --locked

      # The version reaches the shell as an environment variable, never as
      # expression text in the script (as in `verify`).
      - name: Build the tarball and its checksum
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/build-linux-tarball.sh "$VERSION"

      - name: Verify the checksum and list the contents
        working-directory: target/dist
        run: |
          sha256sum -c ./*.sha256
          tar -tzvf ./*.tar.gz

      - name: Upload tarball and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omriss-linux
          path: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
          if-no-files-found: error

  # RFC-072 §9.3. Creates the public GitHub Release for the tag: the title is the
  # bare version, the notes are the tag's CHANGELOG section, and the Linux tarball
  # and its checksum are attached (omriss-bin downloads them from here). Skipped in
  # a dry run. The environment is where the owner's approval (RFC-042 §5) belongs:
  # give it required reviewers, as `microsoft-store` has. A rerun of a release that
  # exists uploads the files again and leaves its title and notes alone.
  release:
    needs: [verify, package, linux]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omriss-linux
          path: dist

      - name: Create the release, or add the files to it
        run: |
          set -euo pipefail
          bash scripts/changelog-section.sh "$VERSION" > notes.md
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading the files again, leaving its title and notes"
            gh release upload "$VERSION" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/*.tar.gz.sha256 \
              --verify-tag --title "$VERSION" --notes-file notes.md
          fi

  # RFC-072 §5.3-§5.4, §9.4. The AUR jobs. Both are skipped, not failed, until the
  # owner sets the repository variable AUR_PUBLISH to "true" (`vars`, because only
  # `vars` is available in a job-level `if`). They wait for the GitHub Release,
  # because omriss-bin's source IS the release's tarball, and so does `publish`:
  # published everywhere or nowhere. The one exception is a rehearsal, which has no
  # release to wait for and writes only to the two scratch packages it was given.
  #
  # The SSH key is on the `aur` environment, never at repository level, so no other
  # workflow or branch can read it, and the environment is where the owner's approval
  # goes (give it a required reviewer). The deploy action runs with that key in scope
  # and is pinned to a commit SHA. It pushes to `master` without --force, so a push
  # that is not a fast-forward fails rather than rewrites the package's history.
  aur-source:
    needs: [verify, package, linux, release]
    if: ${{ !cancelled() && vars.AUR_PUBLISH == 'true' && needs.verify.result == 'success' && needs.package.result == 'success' && needs.linux.result == 'success' && (needs.release.result == 'success' || needs.verify.outputs.aur_rehearsal == 'true') }}
    runs-on: ubuntu-latest
    environment: aur
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      AUR_NAME: ${{ needs.verify.outputs.aur_source_name }}
      REHEARSAL: ${{ needs.verify.outputs.aur_rehearsal }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: AUR credentials must be present
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_COMMIT_USERNAME: ${{ vars.AUR_COMMIT_USERNAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: bash scripts/aur-check-credentials.sh

      - name: Render the PKGBUILD
        run: bash scripts/aur-prepare.sh omriss "$VERSION" "$AUR_NAME" "$REHEARSAL" dist aur-out

      - name: Push to the AUR
        # v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ needs.verify.outputs.aur_source_name }}
          pkgbuild: aur-out/PKGBUILD
          commit_username: ${{ vars.AUR_COMMIT_USERNAME }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.verify.outputs.version }}

  aur-bin:
    needs: [verify, package, linux, release]
    if: ${{ !cancelled() && vars.AUR_PUBLISH == 'true' && needs.verify.result == 'success' && needs.package.result == 'success' && needs.linux.result == 'success' && (needs.release.result == 'success' || needs.verify.outputs.aur_rehearsal == 'true') }}
    runs-on: ubuntu-latest
    environment: aur
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      AUR_NAME: ${{ needs.verify.outputs.aur_bin_name }}
      REHEARSAL: ${{ needs.verify.outputs.aur_rehearsal }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The checksum CI built: the published file is compared against it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omriss-linux
          path: dist

      - name: AUR credentials must be present
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_COMMIT_USERNAME: ${{ vars.AUR_COMMIT_USERNAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: bash scripts/aur-check-credentials.sh

      - name: Render the PKGBUILD
        run: bash scripts/aur-prepare.sh omriss-bin "$VERSION" "$AUR_NAME" "$REHEARSAL" dist aur-out

      - name: Push to the AUR
        # v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ needs.verify.outputs.aur_bin_name }}
          pkgbuild: aur-out/PKGBUILD
          commit_username: ${{ vars.AUR_COMMIT_USERNAME }}
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.verify.outputs.version }}

  publish:
    # RFC-072 §11: a Store submission never exists without its GitHub Release, so
    # it waits for the Linux job and for the release itself. (A skipped `release`,
    # which is a dry run, skips this job too, as its `if` already says.)
    needs: [verify, package, linux, release]
    runs-on: windows-latest
    # Deferred by owner decision, 2026-11-03: setting up Azure Entra and
    # Partner Center for automated publishing needs more preparation than
    # 0.17.0's release could absorb. Until then this job is skipped, not
    # failed — a release pipeline that is red on every tag teaches everyone
    # to stop reading it, and the MSIX the `package` job uploads is still a
    # complete, verified artifact to submit by hand.
    #
    # To turn it back on: set the repository variable STORE_PUBLISH to
    # "true" and put the five secrets on the `microsoft-store` environment.
    # `vars` is used rather than `secrets` because only `vars` is available
    # in a job-level `if`.
    if: ${{ vars.STORE_PUBLISH == 'true' && github.event.inputs.dry_run != 'true' }}
    # Configure this environment with required reviewers, and put all five
    # Store secrets on it rather than at repository level.
    environment: microsoft-store
    steps:
      # Fail with the name of what is missing. 0.17.0's publish ran with every
      # secret unset: the values expanded to nothing, `--tenantId` swallowed
      # the next flag as its value, and the job died complaining that
      # "--sellerId" is not a GUID. An unset credential must say so.
      - name: Store credentials must be present
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          set -u
          missing=()
          for name in AZURE_AD_TENANT_ID SELLER_ID AZURE_AD_APPLICATION_CLIENT_ID \
                      AZURE_AD_APPLICATION_SECRET STORE_PRODUCT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Not set on the 'microsoft-store' environment: ${missing[*]}"
            echo "The MSIX from the package job is still uploaded as an artifact;"
            echo "set the secrets and re-run this job, or submit it by hand."
            exit 1
          fi
          echo "All five Store credentials are present."

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omriss-msix

      # Pinned to a commit SHA: this action runs with the Store credentials in
      # scope, and a moving tag would let it change under us. 15abd1c is v1.1.
      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2

      # The secrets and the version reach PowerShell as environment variables, never
      # as expression text in the script: a value is data, not code, whatever it
      # contains. Every one is quoted, so an empty one would be an empty argument and
      # never a flag that eats the next flag (the check step above refuses an empty
      # one before this runs).
      - name: Reconfigure store credentials
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: >
          msstore reconfigure
          --tenantId "${env:AZURE_AD_TENANT_ID}"
          --sellerId "${env:SELLER_ID}"
          --clientId "${env:AZURE_AD_APPLICATION_CLIENT_ID}"
          --clientSecret "${env:AZURE_AD_APPLICATION_SECRET}"

      - name: Publish package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: >
          msstore publish
          "${env:GITHUB_WORKSPACE}/omriss-${env:VERSION}.msix"
          -id "${env:STORE_PRODUCT_ID}"
