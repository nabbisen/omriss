name: CI

# TESTING.md "CI Requirements" has described this as mandatory since v0.11.0,
# but no workflow existed until now. Items 1-4 there are the floor; this adds
# a Windows job because the app crate links the platform WebView and has only
# ever been built on Linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# `--locked` below: Cargo.lock is committed (.gitignore says why), so CI builds
# exactly the dependency versions the tag will have, and a lockfile that is out of
# date with Cargo.toml fails here instead of changing silently.

jobs:
  # Formatting and the RFC invariants are host-independent; running them once
  # keeps the matrix jobs about compilation rather than about style.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: RFC index invariants
        run: bash scripts/check-rfcs.sh

      # RFC-072: the guards in front of the AUR push (which package names a run may
      # write to, what is rendered for them, the credential check). No network.
      - name: AUR publish guards
        run: bash scripts/test-aur-scripts.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # crates/app links wry/tao. Windows and macOS use the system WebView with
      # no extra packages; Linux needs these or the app crate cannot build,
      # which would silently reduce --workspace to core+ui.
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build docs
