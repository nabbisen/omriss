[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ui",
    "crates/components",
    "crates/app",
]
# The `omriss` app package links against the platform WebView stack (wry/tao); building it
# requires native system libraries (e.g. webkit2gtk on Linux). Core, UI logic and
# the components build and test everywhere, so they are the default members
# (RFC-001, RFC-075).
default-members = [
    "crates/core",
    "crates/ui",
    "crates/components",
]

[workspace.package]
version = "0.17.0"
edition                 = "2024"
rust-version            = "1.88"
license                 = "Apache-2.0"
authors                 = ["nabbisen"]
repository              = "https://github.com/nabbisen/omriss"

[workspace.dependencies]
# The version is what a published package carries. Keep it pinned to the
# current minor: under cargo's 0.x rules a bump from 0.17 to 0.18 may break
# the API, and `"0"` would let a published omriss-ui resolve against it.
omriss-core         = { version = "0.17", path = "crates/core" }
omriss-ui           = { version = "0.17", path = "crates/ui" }
# No `version`: this crate is `publish = false` and only the (also unpublished)
# application depends on it, so there is nothing for a version to describe —
# and nothing for a release to remember to bump.
omriss-components   = { path = "crates/components" }

# UI
# No `desktop` feature here: it belongs to the host. A workspace dependency can
# only add features, so declaring it here would force dioxus-desktop into
# omriss-components and break its wasm build (RFC-075). `omriss` adds it itself.
dioxus              = { version = "0.7" }
dioxus-swdir-tree   = { version = "0.9", default-features = false }
rfd                 = "0.15"
keyboard-types      = "0.7"

# backend
dirs                = "6"
pulldown-cmark      = { version = "0.13", default-features = false }

# general
serde               = { version = "1", features = ["derive"] }
toml                = "0.8"

# test
criterion           = { version = "0.5", features = ["html_reports"] }
proptest            = "1"

[profile.release]
strip = true
lto = "thin"
